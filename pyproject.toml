[project]
name = "weedz"
version = "0.1.0"
description = "Reproducible invasive-weed detection baselines and geospatial review"
readme = "README.md"
authors = [
    { name = "Gardner Bickford", email = "gardner@bickford.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "open-clip-torch>=4.2.2",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "temporalio>=1.36.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
weedz = "weedz:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.pyright]
include = ["src", "tests", "scripts", "main.py"]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "shellcheck-py>=0.11.0.1",
]
