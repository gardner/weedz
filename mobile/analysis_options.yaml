# Strict static analysis for the app (see AGENTS.md). Very Good Analysis turns on
# most lints; the language modes below forbid implicit dynamic and implicit casts.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # An app, not a published package: public API docs are not required.
    public_member_api_docs: false
