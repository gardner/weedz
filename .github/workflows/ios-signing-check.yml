name: iOS Signing Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-signing-check
  cancel-in-progress: false

jobs:
  ios-signing-check:
    name: iOS signing proof (unconfigured app)
    if: github.ref == 'refs/heads/main'
    environment: mobile-release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Prepare Apple identity and profile with empty development configuration
        env:
          IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: >-
          python src/weedz/mobile_build.py ios --ios-signing-check
          --state "$RUNNER_TEMP/weedz-signing-check"
      - name: Install locked Flutter dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build signed IPA for signing validation only
        working-directory: mobile
        run: >-
          flutter build ipa --release
          --export-options-plist="$RUNNER_TEMP/weedz-signing-check/ios/ExportOptions.plist"
          --dart-define-from-file="$RUNNER_TEMP/weedz-signing-check/config.json"
      - name: Label the unconfigured signing-check artifact
        run: |
          mkdir -p "$RUNNER_TEMP/ios-signing-check-artifact"
          cp mobile/build/ios/ipa/*.ipa "$RUNNER_TEMP/ios-signing-check-artifact/"
          printf '%s\n' 'Signing validation only; not a production release.' 'Deployment URLs are unset. Deployment-dependent app features are unavailable.' 'No store upload has been performed.' > "$RUNNER_TEMP/ios-signing-check-artifact/README.txt"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-signing-check
          path: ${{ runner.temp }}/ios-signing-check-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material and restore keychain configuration
        if: always()
        run: >-
          python src/weedz/mobile_build.py ios --cleanup
          --state "$RUNNER_TEMP/weedz-signing-check"
