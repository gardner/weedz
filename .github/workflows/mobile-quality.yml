name: Mobile Quality

on:
  pull_request:
    paths: &mobile-paths
      - "mobile/**"
      - "scripts/check_file_length.py"
      - ".github/workflows/mobile-quality.yml"
  push:
    branches: [main]
    paths: *mobile-paths

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: File length (max 500 lines, Dart source)
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/check_file_length.py --max-lines 500
          $(find mobile/lib mobile/test -type f -name '*.dart' | sort)

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (strict lints; infos fail too)
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
