name: Web Quality

on:
  pull_request:
    paths: &web-paths
      - "web/**"
      - "scripts/check_file_length.py"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [main]
    paths: *web-paths

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_WEEDZ_DEFAULT_RUN_ID: plants
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: File length (max 500 lines, web source)
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/check_file_length.py --max-lines 500
          $(find web/app web/components web/lib web/scripts -type f
          \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.css' \) | sort)

      - name: Type check, lint and format (tsc + Biome)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium (for the browser regression test)
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # The test drives the built app in a browser and mocks its API, so only
      # the Next server runs (not the Python API). Its log is shown on failure.
      - name: Test
        run: |
          pnpm start > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:3001 && break
            sleep 1
          done
          pnpm test || { cat "$RUNNER_TEMP/next.log"; exit 1; }
