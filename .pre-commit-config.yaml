# Hooks run before each commit unless they name another stage. `pre-commit install`
# installs both hook types below (rerun it once in an existing clone).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: file-length
        name: Maximum 500 lines per Python source file
        entry: uv run --locked python scripts/check_file_length.py
        args: [--max-lines, "500"]
        language: system
        files: ^(src/|scripts/).*\.py$|^main\.py$
        types: [python]
      - id: ruff
        name: Ruff lint and complexity
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: Pyright type checking
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        files: ^(src/|tests/|scripts/|main\.py$|pyproject\.toml$|uv\.lock$)
      - id: shellcheck
        name: ShellCheck
        entry: uv run --locked shellcheck
        language: system
        types: [shell]
      - id: reviews-finished
        name: No code review of this branch's PR is still running
        entry: scripts/check-reviews-before-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
